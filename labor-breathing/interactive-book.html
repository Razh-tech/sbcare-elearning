<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3f6c75">
<meta name="description" content="Labor Breathing: teknik panduan napas untuk kehamilan dan persalinan. Smilebirth, oleh Bidan Cahyaning Puji Astuti.">
<title>Labor Breathing</title>

  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };

<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: aplikasi satu kolom (maks 720px). Beranda = pertanyaan "Apa yang Bunda rasakan?" + dua pintu; kartu keluhan membuka halaman detail berisi pemandu napas bersuara. Warna dari identitas Smilebirth (teal + coral di atas blush). */
:root{
  --bg:#fdf1ef; --page:#ffffff; --ink:#24393e; --muted:#5d7277;
  --teal:#3f6c75; --teal-soft:#e3eef0; --coral:#e47a67; --coral-soft:#fde3dd;
  --line:#dbe5e7; --ok:#2f8a63; --ok-soft:#e1f3ea; --warn:#b14f2b; --warn-soft:#fbe6da;
  --on-teal:#ffffff;
  --in:#3a968b; --hold:#d4952a; --out:#e06c58; --pause:#8a84b6;
  --shadow:0 1px 0 rgba(63,108,117,.06),0 12px 28px -20px rgba(63,108,117,.55);
  --display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --body:"Quicksand","Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#142125; --page:#1c2d32; --ink:#e9f1f1; --muted:#a6bbbe; --teal:#8cc4cd; --teal-soft:#24414a;
  --coral:#f29a88; --coral-soft:#4a2c28; --line:#2e464d; --ok:#7fd4ac; --ok-soft:#1d3d31; --warn:#f3a17f; --warn-soft:#46291f;
  --on-teal:#10262b; --in:#6fcfbf; --hold:#f0bd5a; --out:#f29a88; --pause:#b3aee0; --shadow:0 12px 28px -20px rgba(0,0,0,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#142125; --page:#1c2d32; --ink:#e9f1f1; --muted:#a6bbbe; --teal:#8cc4cd; --teal-soft:#24414a;
  --coral:#f29a88; --coral-soft:#4a2c28; --line:#2e464d; --ok:#7fd4ac; --ok-soft:#1d3d31; --warn:#f3a17f; --warn-soft:#46291f;
  --on-teal:#10262b; --in:#6fcfbf; --hold:#f0bd5a; --out:#f29a88; --pause:#b3aee0; --shadow:0 12px 28px -20px rgba(0,0,0,.85); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.65;font-weight:500;padding-inline:16px;padding-block:0 110px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0;color:var(--teal);font-weight:800}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.app{max-width:720px;margin:0 auto;display:grid;gap:22px}

/* bar atas */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-16px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;color:var(--teal);white-space:nowrap;background:none;border:0;padding:0}
.brand b{color:var(--coral)}
.bar .sp{flex:1}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--page);border-radius:99px;padding:5px 12px 5px 6px;font-size:14px;font-weight:700}
.toggle .sw{width:30px;height:18px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--page);transition:transform .2s}
.toggle[aria-pressed="true"]{border-color:var(--coral)}
.toggle[aria-pressed="true"] .sw{background:var(--coral)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(12px)}

/* beranda */
.hero{display:grid;gap:10px;padding-top:14px}
.kicker{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);font-weight:700}
.hero h1{font-size:clamp(34px,7vw,50px);letter-spacing:-.01em}
.hero .sub{font-family:var(--display);font-weight:600;font-size:clamp(18px,3.4vw,22px);color:var(--ink);line-height:1.3}
.byline{font-size:13.5px;color:var(--muted)}
.ask{background:var(--page);border-radius:24px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line);display:grid;gap:14px}
.ask h2{font-size:24px}
.search{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.door{border:0;text-align:left;border-radius:20px;padding:18px;display:grid;gap:4px;min-width:0}
.door.h{background:var(--coral-soft)}
.door.s{background:var(--teal-soft)}
.door.c{background:color-mix(in srgb,var(--pause) 20%,var(--page))}
.door strong{font-family:var(--display);font-size:22px;color:var(--teal);line-height:1.1}
.door span{font-size:14px;color:var(--muted);line-height:1.4}
.door .ct{font-size:13px;font-weight:700;color:var(--coral)}
.results{display:grid;gap:8px}
.basic{display:flex;gap:14px;align-items:center;background:var(--teal);color:var(--on-teal);border:0;border-radius:20px;padding:16px 18px;text-align:left}
.basic .ring{flex:none;width:46px;height:46px;border-radius:50%;border:3px solid currentColor;display:grid;place-items:center;font-family:var(--display);font-weight:800}
.basic strong{font-family:var(--display);font-size:19px;display:block;line-height:1.2}
.basic span{font-size:14px;opacity:.9;line-height:1.4;display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h2{font-size:24px}
.sec-h .lnk{border:0;background:none;color:var(--coral);font-weight:700;font-size:14px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--page);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14.5px}
.chip:hover{border-color:var(--teal)}
.chip.fav{border-color:var(--coral)}

/* daftar kartu */
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--page);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.item strong{font-family:var(--display);font-size:19px;color:var(--ink);line-height:1.2}
.item .f{grid-column:1;font-size:14px;color:var(--muted);line-height:1.4}
.item .e{grid-column:1;font-size:12.5px;font-weight:700;color:var(--teal);letter-spacing:.02em}
.item .pt{grid-row:1 / span 3;grid-column:2;font-family:var(--display);font-weight:800;color:var(--coral);font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.item.stage{border-left:6px solid var(--teal)}
.empty{color:var(--muted);text-align:center;padding:12px}

/* detail */
.back{justify-self:start;border:1.5px solid var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:700;padding:7px 16px;border-radius:99px;font-size:15px;margin-top:8px}
.back:hover{background:var(--teal);color:var(--on-teal)}
.navbot{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--page) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.navbot-in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.nb-back{border:1.5px solid var(--teal);background:var(--page);color:var(--teal);font-weight:700;border-radius:99px;padding:11px 18px;white-space:nowrap}
.nb-home{flex:1;border:0;background:var(--coral);color:#fff;font-weight:700;border-radius:99px;padding:11px 18px;font-size:16px}
.d-head{display:grid;gap:8px}
.d-head .row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.d-head h1{font-size:clamp(30px,6vw,42px)}
.star{flex:none;border:1.5px solid var(--line);background:var(--page);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700}
.star[aria-pressed="true"]{border-color:var(--coral);background:var(--coral-soft)}
.est{display:inline-block;justify-self:start;font-size:13px;font-weight:700;color:var(--teal);background:var(--teal-soft);padding:3px 12px;border-radius:99px}
.intro{font-size:17px;max-width:62ch}
.card{background:var(--page);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:grid;gap:12px}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:99px;justify-self:start;flex-wrap:wrap}
.tabs button{border:0;background:none;border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--page);color:var(--teal);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.nap-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.nap-h h2{font-size:24px;color:var(--ink)}
.pat{font-family:var(--display);font-weight:800;font-size:22px;color:var(--coral);font-variant-numeric:tabular-nums}
.pat small{font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:700;display:block;text-align:right;letter-spacing:.02em}
.steps{margin:0;padding-left:1.25em;display:grid;gap:6px}

/* pemandu */
.pacer{display:grid;gap:12px}
.stage-box{position:relative;height:250px;display:grid;place-items:center;border-radius:20px;background:radial-gradient(circle at 50% 50%,var(--coral-soft),transparent 70%)}
.orb{--ph:var(--coral);width:116px;height:116px;border-radius:50%;background-color:var(--ph);background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),transparent 62%);box-shadow:0 0 0 14px color-mix(in srgb,var(--ph) 18%,transparent);transform:scale(1);transition:transform 1s ease-in-out,background-color .5s,box-shadow .5s}
.orb[data-ph="in"]{--ph:var(--in)}.orb[data-ph="hold"]{--ph:var(--hold)}.orb[data-ph="out"]{--ph:var(--out)}.orb[data-ph="pause"]{--ph:var(--pause)}
.segs{display:flex;gap:4px;height:14px}
.seg{border-radius:99px;opacity:.28;transition:opacity .3s,transform .3s}
.seg.on{opacity:1;transform:scaleY(1.25)}
.seg.in,.lg.in i{background:var(--in)}.seg.hold,.lg.hold i{background:var(--hold)}.seg.out,.lg.out i{background:var(--out)}.seg.pause,.lg.pause i{background:var(--pause)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13.5px;font-weight:700;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:50%;display:inline-block}
.pat .c-in{color:var(--in)}.pat .c-hold{color:var(--hold)}.pat .c-out{color:var(--out)}.pat .c-pause{color:var(--pause)}
.tris{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tri-t{border:1.5px solid var(--line);background:var(--page);border-radius:18px;padding:14px;text-align:left;display:grid;gap:2px;min-width:0}
.tri-t:hover{border-color:var(--coral)}
.tri-t strong{font-family:var(--display);font-size:20px;color:var(--teal);line-height:1.1}
.tri-t span{font-size:13px;color:var(--muted);line-height:1.35}
.tri-t .wk{font-weight:700;color:var(--coral)}
.door.wide{grid-column:1 / -1}
.todo{display:grid;gap:8px}
.todo-i{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:10px 12px}
.todo-i input{width:22px;height:22px;accent-color:var(--teal);flex:none}
.todo-i .tx{flex:1;min-width:0;line-height:1.35}
.todo-i .tx b{font-family:var(--display);font-size:17px;display:block}
.todo-i .tx small{color:var(--muted);font-size:13px}
.todo-i .mini{flex:none;border:0;background:var(--teal);color:var(--on-teal);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px}
.prog-t{font-size:14px;font-weight:700;color:var(--teal)}
.durhelp{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.5;display:grid;gap:6px}
.durhelp b{color:var(--teal)}
.durhelp .tip{color:var(--muted);font-size:13.5px}
.orb-txt{position:absolute;text-align:center;color:#fff;font-family:var(--display);pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.orb-txt .c{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.orb-txt .w{font-size:17px;font-weight:700;line-height:1.1;max-width:150px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.btn{border:0;background:var(--coral);color:#fff;font-weight:700;padding:11px 22px;border-radius:99px;font-size:16px}
.btn.alt{background:var(--teal);color:var(--on-teal)}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.sel{border:1.5px solid var(--line);background:var(--page);border-radius:99px;padding:8px 12px;font-size:14px;font-weight:700}
.status{text-align:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
canvas.wave{width:100%;height:64px;display:block}
.wave-l{text-align:center;font-family:var(--display);font-weight:700;color:var(--teal)}
.feel{background:var(--bg);border-radius:16px;padding:14px;display:grid;gap:10px;text-align:center}
.feel p{font-weight:700}
.feel .chips{justify-content:center}
.feel-msg{font-size:15px;color:var(--teal);font-weight:600}

.box{border-radius:18px;padding:16px 18px;display:grid;gap:8px}
.box h3{font-size:19px}
.box ul{margin:0;padding-left:1.2em;display:grid;gap:5px}
.box.tips{background:var(--teal-soft)}
.box.flag{background:var(--warn-soft)}
.box.flag h3{color:var(--warn)}
.box.partner{background:var(--coral-soft)}
.box.partner li{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.35}
.basic-grid{display:grid;gap:12px}

.foot{font-size:13.5px;color:var(--muted);display:grid;gap:8px;border-top:1px solid var(--line);padding-top:18px}
.cta{background:var(--teal);color:var(--on-teal);border-radius:22px;padding:20px;display:grid;gap:6px}
.cta h3{color:var(--on-teal);font-size:21px}

@media (prefers-reduced-motion: reduce){.orb{transition:none!important}}
@media (max-width:520px){.doors{grid-template-columns:1fr}.tris{grid-template-columns:1fr}.toggle .lbl{display:none}.toggle{padding-right:6px}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <button class="brand" id="home" aria-label="Kembali ke beranda">smile<b>birth</b></button>
    <span class="sp"></span>
    <button class="toggle" id="partnerToggle" aria-pressed="false"><span class="sw"></span><span class="lbl">Mode pendamping</span></button>
  </div>
</header>

<main class="app" id="view"></main>
<nav class="navbot" id="navbot" hidden aria-label="Navigasi bawah"><div class="navbot-in"><button class="nb-back" data-back>‹ Kembali</button><button class="nb-home" id="nbHome">Pilih napas lain</button></div></nav>

<script>
/* ===== Data napas ===== */
const N={
 dada:{name:"Napas Dada",p:[4,1,4,0],out:"Embuskan pelan",steps:["Letakkan satu tangan di dada.","Tarik napas lewat hidung, rasakan dada naik.","Embuskan lewat mulut pelan-pelan."]},
 diafragma:{name:"Napas Diafragma",p:[4,1,4,0],out:"Embuskan, rusuk menyempit",steps:["Letakkan kedua tangan di tulang rusuk bawah.","Tarik napas, rasakan rusuk melebar ke samping.","Embuskan, rasakan rusuk kembali menyempit."]},
 perut:{name:"Napas Perut",p:[4,1,4,0],out:"Embuskan, perut kempis",steps:["Letakkan tangan di perut, seperti memeluk adik bayi.","Tarik napas, perut mengembang lembut.","Embuskan, perut kembali kempis."]},
 diafperut:{name:"Napas Diafragma-Perut",p:[4,1,4,0],out:"Embuskan panjang",steps:["Satu tangan di rusuk bawah, satu di perut.","Tarik napas: rusuk melebar, lalu perut mengembang.","Embuskan panjang sampai keduanya rileks."]},
 sedotan:{name:"Tiup Sedotan",p:[4,4,6,2],out:"Tiup lewat sedotan",steps:["Siapkan sedotan, atau buat bibir mengerucut seperti memegang sedotan.","Tarik napas lewat hidung 4 hitungan, tahan 4.","Embuskan pelan lewat sedotan 6 hitungan, jeda 2."]},
 n478:{name:"Napas Nyenyak 4-7-8",p:[4,7,8,0],out:"Embuskan panjang",steps:["Berbaring miring ke kiri, lemaskan seluruh tubuh.","Tarik napas lewat hidung 4 hitungan, tahan 7.","Embuskan lewat mulut 8 hitungan. Cukup 4 putaran."]},
 tenang:{name:"Napas Tenang 4-2-6",p:[4,2,6,0],out:"Embuskan pelan",steps:["Tarik napas lewat hidung 4 hitungan.","Tahan lembut 2 hitungan.","Embuskan 6 hitungan. Embusan yang lebih panjang memberi sinyal aman ke tubuh."]},
 bibir:{name:"Napas Bibir Mengerucut",p:[2,0,4,0],out:"Bibir mengerucut",steps:["Duduk tegak, bahu lemas.","Tarik napas lewat hidung 2 hitungan.","Embuskan 4 hitungan lewat bibir mengerucut, seperti bersiul pelan."]},
 pemulih:{name:"Napas Pemulih 3-5-7",p:[3,5,7,0],out:"Embuskan pelan",steps:["Tangkupkan kedua telapak tangan di depan hidung dan mulut.","Tarik napas pelan 3 hitungan, tahan 5.","Embuskan 7 hitungan. Ulangi sampai kesemutan hilang."]},
 calm:{name:"Calm & Slow",p:[4,2,4,0],out:"Embuskan, lemaskan",steps:["Duduk bersandar atau berbaring miring.","Tarik napas perut 4 hitungan, tahan 2.","Embuskan 4 hitungan sambil menurunkan bahu dan melemaskan rahang."]},
 calm6:{name:"Calm & Slow Panjang",p:[6,3,6,0],out:"Embuskan, lemaskan",steps:["Posisi paling nyaman, mata boleh terpejam.","Tarik napas perut 6 hitungan, tahan 3.","Embuskan 6 hitungan. Bayangkan tubuh makin berat dan hangat."]},
 balance:{name:"Relax & Balance",p:[4,2,4,0],out:"Embuskan lubang sebaliknya",steps:["Tutup lubang hidung kanan dengan ibu jari, tarik napas lewat kiri.","Tahan sebentar, tutup lubang kiri, embuskan lewat kanan.","Putaran berikutnya dibalik: masuk kanan, keluar kiri."]},
 lilin:{name:"Tiup Lilin",p:[4,4,4,0],out:"Tiup lilin pelan",steps:["Tarik napas lewat hidung 4 hitungan.","Tahan lembut 4 hitungan.","Tiup pelan lewat mulut seperti meniup lilin tanpa memadamkannya."]},
 heehuu:{name:"Hee-Huu",p:[4,2,6,0],out:"hee... huu...",steps:["Tarik napas lewat hidung 4 hitungan.","Tahan 2 hitungan.","Keluarkan 6 hitungan sambil bersuara pelan: “hee... huu...”."]},
 hehehoho:{name:"Hehe-Hoho",p:[4,2,8,0],out:"he-he... ho-ho...",steps:["Tarik napas lewat hidung 4 hitungan.","Tahan 2 hitungan.","Keluarkan 8 hitungan dengan suara rendah: “he-he... ho-ho...”. Rahang lemas."]},
 desis:{name:"Smile Hissing",p:[4,1,8,0],out:"Senyum... sssss...",steps:["Tarik napas lewat hidung 4 hitungan, tahan 1.","Tersenyum kecil.","Keluarkan napas lewat sela gigi: “sssss...” selama 8 hitungan."]},

let actx=null,idVoice=null;
function ensureAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}}
function loadVoice(){try{const v=speechSynthesis.getVoices().filter(x=>/^(id|in)[-_]/i.test(x.lang)||/^id$/i.test(x.lang));
  const male=/ardi|andika|male|pria|laki|man\b/i,fem=/damayanti|gadis|female|wanita|perempuan|google/i;
  idVoice=v.find(x=>fem.test(x.name)&&!male.test(x.name))||v.find(x=>!male.test(x.name))||null}catch(e){}}
if("speechSynthesis" in window){loadVoice();try{speechSynthesis.onvoiceschanged=loadVoice}catch(e){}}
function tone(kind,secs){
  if(!actx)return;try{
  const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type="sine";
  if(kind==="in"){o.frequency.setValueAtTime(220,t);o.frequency.linearRampToValueAtTime(330,t+secs)}
  else if(kind==="out"){o.frequency.setValueAtTime(330,t);o.frequency.linearRampToValueAtTime(196,t+secs)}
  else{o.frequency.setValueAtTime(523,t);secs=.6}
  const peak=kind==="in"||kind==="out"?.07:.05;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+.25);
  g.gain.setValueAtTime(peak,Math.max(t+.26,t+secs-.3));g.gain.linearRampToValueAtTime(0,t+secs);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+secs+.05)}catch(e){}
}
function say(txt){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="id-ID";u.rate=.85;u.pitch=1.15;if(idVoice)u.voice=idVoice;speechSynthesis.speak(u)}catch(e){}}
const WORD={in:"Tarik",hold:"Tahan",out:"Embuskan",pause:"Jeda"};
function cue(ph){
  if(S.sound==="nada")tone(ph.k,ph.s);
  else if(S.sound==="suara"){if("speechSynthesis" in window)say(WORD[ph.k]);else tone(ph.k,ph.s)}
}

function scale(s,secs){const o=$("orb");if(!o)return;o.style.transition=`transform ${reduce?0:secs}s ease-in-out, background-color .5s, box-shadow .5s`;o.style.transform=`scale(${s})`}
function startPacer(){
  const n=N[curN];const [a,b,c,d]=n.p;phases=[];
  if(a)phases.push({k:"in",s:a,w:"Tarik lewat hidung"});
  if(b)phases.push({k:"hold",s:b,w:"Tahan lembut"});
  if(c)phases.push({k:"out",s:c,w:n.out});
  if(d)phases.push({k:"pause",s:d,w:"Jeda"});
  const dv=$("dur").value;waveMode=dv==="60w";cycleLimit=dv==="c4"?4:0;limit=waveMode?60:(cycleLimit?0:+dv);
  if(S.sound!=="hening")ensureAudio();
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>lock=l).catch(()=>{})}catch(e){}
  running=true;pi=0;cycles=0;elapsed=0;$("feel").hidden=true;
  $("go").textContent="Berhenti";scale(1,.01);enter();status();if(waveMode)drawWave(0);
  timer=setInterval(tick,1000);
}
function enter(){const ph=phases[pi];rem=ph.s;$("word").textContent=ph.w;$("cnt").textContent=rem;$("orb").dataset.ph=ph.k;document.querySelectorAll("#segs .seg").forEach(x=>x.classList.toggle("on",x.dataset.s===ph.k));
  if(ph.k==="in")scale(1.75,ph.s);else if(ph.k==="out")scale(1,ph.s);cue(ph)}
function tick(){
  rem--;elapsed++;
  if(limit&&elapsed>=limit){finish();return}
  if(rem<=0){pi++;if(pi>=phases.length){pi=0;cycles++;if(cycleLimit&&cycles>=cycleLimit){status();finish();return}}enter()}else $("cnt").textContent=rem;
  status();if(waveMode)drawWave(elapsed);
}
function status(){const s=$("stat");if(s)s.textContent=`Pola ${pat(N[curN])} · ${cycles}${cycleLimit?" dari "+cycleLimit:""} putaran${limit?` · ${Math.min(elapsed,limit)} dari ${limit} detik`:` · ${elapsed} detik`}`}
function stopPacer(msg){
  clearInterval(timer);timer=null;const was=running;running=false;
  try{speechSynthesis.cancel()}catch(e){}
  try{lock&&lock.release();lock=null}catch(e){}
  if(!$("go"))return;delete $("orb").dataset.ph;document.querySelectorAll("#segs .seg").forEach(x=>x.classList.remove("on"));$("go").textContent="Mulai";scale(1,1);$("cnt").textContent="";$("word").textContent=msg||"Siap?";
}
function finish(){
  stopPacer(waveMode?"Gelombang selesai":"Selesai");if(waveMode)drawWave(60);
  if(S.sound==="suara")say("Selesai. Bernapas biasa.");else if(S.sound==="nada")tone("hold",.6);
  const f=$("feel");f.hidden=false;
  f.innerHTML=`<p>Bagaimana rasanya sekarang?</p><div class="chips"><button class="chip" data-f="ok">Lebih tenang</button><button class="chip" data-f="biasa">Biasa saja</button><button class="chip" data-f="pusing">Pusing atau kesemutan</button></div><p class="feel-msg" id="fm"></p>`;
  f.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{
    const fm=$("fm"),v=b.dataset.f;
    if(v==="ok"){fm.innerHTML=S.fav.includes(curK.id)||curK.id==="dasar"||curK.id.startsWith("n:")?"Bagus. Ulangi kapan saja Bunda butuh.":`Bagus. <button class="chip fav" id="favNow">☆ Simpan ke favorit</button>`;
      const fn=$("favNow");if(fn)fn.addEventListener("click",()=>{S.fav=[...S.fav,curK.id];save();fm.textContent="Tersimpan. Kartu ini muncul di beranda.";const st=$("star");if(st){st.setAttribute("aria-pressed","true");st.textContent="★ Favorit"}})}
    else if(v==="biasa")fm.textContent=curK.alt?"Wajar di awal. Coba sekali lagi, atau pilih tab satunya.":"Wajar di awal. Napas makin terasa manfaatnya setelah rutin dilatih beberapa hari.";
    else{fm.innerHTML=`Berhenti dulu dan bernapas lebih pelan. <button class="chip" data-k="pusing">Buka napas pemulih</button>`}
  }));
}
function drawWave(t){
  const cv=$("wave");if(!cv||cv.hidden)return;const ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
  const cs=getComputedStyle(document.documentElement),col=v=>cs.getPropertyValue(v).trim();
  ctx.clearRect(0,0,W,H);
  const y=x=>H-6-(H-18)*Math.exp(-Math.pow((x/W-.5)/.2,2));
  ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=4)ctx.lineTo(x,y(x));ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=col("--coral-soft");ctx.fill();
  ctx.beginPath();for(let x=0;x<=W;x+=4)x?ctx.lineTo(x,y(x)):ctx.moveTo(x,y(x));ctx.strokeStyle=col("--coral");ctx.lineWidth=3;ctx.stroke();
  const px=Math.min(t,60)/60*W;ctx.beginPath();ctx.arc(px,y(px),8,0,7);ctx.fillStyle=col("--teal");ctx.fill();
  const l=$("waveL");if(l&&running)l.textContent=t<20?"Gelombang naik. Ikuti napasnya.":t<40?"Puncak gelombang. Bunda kuat, terus bernapas.":"Gelombang turun. Sebentar lagi selesai.";
  else if(l&&t>=60)l.textContent="Gelombang selesai. Tarik napas panjang, lepaskan.";
}
document.addEventListener("keydown",e=>{if(e.key===" "&&$("go")&&document.activeElement===document.body){e.preventDefault();$("go").click()}});

hist=[["home"]];renderHome();
</script>
